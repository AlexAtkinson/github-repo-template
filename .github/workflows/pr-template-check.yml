name: Pull Request Template Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  security-checklist:
    name: Security checklist
    runs-on: ubuntu-latest
    steps:
      - name: Require a complete security checklist
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const required = [
              'I did not add secrets, credentials, tokens, or private data.',
              'I considered input validation, authorization, and access control.',
              'I considered dependency, infrastructure, and deployment security impact.',
              'I added or updated security-relevant tests where appropriate.',
              'I confirmed this change does not weaken logging, monitoring, or incident response.',
            ];

            if (!body.includes('<!-- security-checklist:start -->') || !body.includes('<!-- security-checklist:end -->')) {
              core.setFailed('The routed security checklist is missing from the PR body.');
              return;
            }

            const incomplete = required.filter((item) => {
              const escaped = item.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              return !new RegExp(`^- \\[x\\] ${escaped}$`, 'mi').test(body);
            });

            if (incomplete.length > 0) {
              core.setFailed(`Complete every security checklist item before merging:\n- ${incomplete.join('\n- ')}`);
            }