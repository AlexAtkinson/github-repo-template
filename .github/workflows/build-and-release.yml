name: Release / Build and Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Attest, Sign, and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: AlexAtkinson/github-action-gitops-autover@e01a5fdd62607c712c54a838e7c8a79f212a8e9f # 0.13.0
        with:
          force-patch-increment: true

      - name: Create example asset
        run: echo "Hello World!" > asset.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            asset.txt
            LICENSE
            NOTICE

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            asset.txt
            LICENSE
            NOTICE
          sbom-path: sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.2.1

      - name: Sign example asset
        run: >-
          cosign sign-blob --yes --output-signature asset.txt.sig
          --output-certificate asset.txt.pem asset.txt

      - name: Sign SBOM
        run: >-
          cosign sign-blob --yes --output-signature sbom.spdx.json.sig
          --output-certificate sbom.spdx.json.pem sbom.spdx.json

      - name: Sign license and attribution notice
        shell: bash
        run: |
          for file in LICENSE NOTICE; do
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" "$file"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.new-version }}
          name: ${{ steps.version.outputs.new-version }}
          generate_release_notes: true
          files: |
            asset.txt
            asset.txt.sig
            asset.txt.pem
            sbom.spdx.json
            sbom.spdx.json.sig
            sbom.spdx.json.pem
            LICENSE
            LICENSE.sig
            LICENSE.pem
            NOTICE
            NOTICE.sig
            NOTICE.pem