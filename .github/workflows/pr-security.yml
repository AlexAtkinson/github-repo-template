name: PR / Checks / Security

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security and Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install detect-secrets
        run: python -m pip install --disable-pip-version-check detect-secrets

      - name: Scan for secrets with detect-secrets
        shell: bash
        run: |
          exclude_files='(^|/)(\.git|node_modules)/|(^|/)\.githooks/gitleaks\.toml$'
          exclude_files+='|(^|/)\.agents/skills/megalinter(-check|-fix|-setup)?/'
          exclude_files+='|(^|/)skills-lock\.json$'
          detect-secrets scan --all-files --exclude-files "$exclude_files" > detect-secrets.json
          findings=$(jq '[.results | to_entries[]] | length' detect-secrets.json)
          if [[ "$findings" -ne 0 ]]; then
            echo "detect-secrets found $findings potential secret(s)."
            cat detect-secrets.json
            exit 1
          fi

      - name: Run MegaLinter
        uses: oxsecurity/megalinter/flavors/ci_light@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATE_ALL_CODEBASE: true
          GITHUB_COMMENT_REPORTER: "false"

      - name: Check for Dockerfiles
        id: dockerfiles
        shell: bash
        run: |
          if find . -type f \( -iname 'Dockerfile' -o -iname 'Dockerfile.*' \) -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Hadolint
        if: steps.dockerfiles.outputs.present == 'true'
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          recursive: true

      - name: Check for infrastructure files
        id: iac
        shell: bash
        run: |
          if find . -type f \( -name '*.tf' -o -name '*.tf.json' -o -name 'template.yml' -o -name 'template.yaml' -o -name 'serverless.yml' -o -name 'serverless.yaml' \) -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Checkov
        if: steps.iac.outputs.present == 'true'
        uses: bridgecrewio/checkov-action@a76233b2c1d4a820a9dc68be350c473a4a9dceec # v12.3130.0
        with:
          directory: .
          quiet: true
