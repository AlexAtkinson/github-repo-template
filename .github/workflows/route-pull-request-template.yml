name: Route Pull Request Template

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write

jobs:
  route-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Route selected template
        uses: actions/github-script@v7
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const routes = [
              ['docs', '📝 Docs', 'semver:patch'],
              ['fix', '🐛 Fix', 'semver:patch'],
              ['ops', '⚙️ Ops', 'semver:patch'],
              ['feature', '🚀 Feature', 'semver:minor'],
              ['enhancement', '✨ Enhancement', 'semver:minor'],
              ['major', '🏆 Major / ⛓‍💥 Breaking', 'semver:major'],
            ];
            const body = process.env.PR_BODY || '';
            const selected = routes.filter(([, label]) =>
              new RegExp(`^- \\[x\\] ${label.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}$`, 'mi').test(body)
            );

            if (selected.length !== 1 || body.includes('<!-- pr-template-route:')) {
              return;
            }

            const [, label, semverLabel] = selected[0];
            const route = routes.find(([, routeLabel]) => routeLabel === label)[0];
            const template = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, '.github', 'PULL_REQUEST_TEMPLATE', `${route}.md`), 'utf8').trim();
            const security = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, '.github', 'PULL_REQUEST_TEMPLATE', 'security-checklist.md'), 'utf8').trim();

            const semverLabels = ['semver:patch', 'semver:minor', 'semver:major'];
            for (const existingLabel of semverLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: existingLabel,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: semverLabel,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: semverLabel,
                color: semverLabel === 'semver:major' ? 'b60205' : semverLabel === 'semver:minor' ? 'fbca04' : '0e8a16',
              });
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [semverLabel],
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: `${template}\n\n${security}\n`,
            });